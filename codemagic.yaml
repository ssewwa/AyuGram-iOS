# AyuGram iOS — Codemagic CI
# Put this file in the root of the AyuGram iOS repo (a fork of TelegramMessenger/Telegram-iOS).
#
# Environment variable groups to create in Codemagic (App settings → Environment variables):
#   telegram_api : TG_API_ID, TG_API_HASH            (from https://my.telegram.org/apps, a separate key for iOS)
#   codemagic_api: CM_API_TOKEN                      (Codemagic API token, used to refresh the build cache)

definitions:
  # Bazel's disk cache is tens of thousands of small files; Codemagic needs ~13 min to archive
  # them. We pack it into one zstd file ourselves (~1 min) and let Codemagic cache that file.
  # Codemagic keeps the cache only from successful builds, for 14 days, max 3 GB per workflow,
  # and never overwrites an existing cache, so "Pack Bazel cache" deletes the old one first.
  cache: &cache
    cache_paths:
      - $HOME/bazel-cache-archive
  env: &env
    xcode: 26.2            # must match "xcode" in versions.json
    groups:
      - telegram_api
      - codemagic_api
  scripts:
    - &submodules
      name: Fetch submodules
      script: git submodule update --init --recursive --depth 1 --jobs 8
    - &metal
      name: Prepare toolchain
      script: |
        # Xcode 26 ships without the Metal compiler; Telegram compiles .metal shaders
        xcodebuild -downloadComponent MetalToolchain
        # TDLib's CMake picks up Homebrew's ccache, but Bazel's sandbox PATH can't run it
        brew uninstall --ignore-dependencies ccache 2>/dev/null || true
        if command -v ccache >/dev/null; then sudo rm -f "$(command -v ccache)"; fi
    - &restore_cache
      name: Restore Bazel cache
      script: |
        brew list zstd >/dev/null 2>&1 || brew install zstd
        ARCHIVE="$HOME/bazel-cache-archive/cache.tar.zst"
        if [ -f "$ARCHIVE" ]; then
          echo "Restoring $(du -h "$ARCHIVE" | cut -f1) Bazel cache"
          time (zstd -d -T0 -c "$ARCHIVE" | tar -xf - -C "$HOME")
          du -sh "$HOME/telegram-bazel-cache" || true
        else
          echo "No Bazel cache yet, full build"
        fi
    - &pack_cache
      name: Pack Bazel cache
      script: |
        mkdir -p "$HOME/bazel-cache-archive"
        ARCHIVE="$HOME/bazel-cache-archive/cache.tar.zst"
        du -sh "$HOME/telegram-bazel-cache" || true
        time (tar -cf - -C "$HOME" telegram-bazel-cache | zstd -T0 -3 -q -f -o "$ARCHIVE")
        SIZE_MB=$(( $(stat -f%z "$ARCHIVE") / 1024 / 1024 ))
        echo "Cache archive: ${SIZE_MB} MB"
        # stay under Codemagic's 3 GB limit; start over when the cache grows too big
        if [ "$SIZE_MB" -gt 2800 ]; then
          echo "Too big, dropping the cache"
          rm -f "$ARCHIVE"
        fi
        # Codemagic skips saving when a cache already exists: remove the old one so this build's is kept
        if [ -n "${CM_API_TOKEN:-}" ]; then
          APP_ID="${CM_PROJECT_ID:-6ac5d8d3276a02cb991e88a0}"
          for CACHE_ID in $(curl -sS -H "x-auth-token: $CM_API_TOKEN" "https://api.codemagic.io/apps/$APP_ID/caches" | python3 -c 'import json,sys; print(" ".join(c["_id"] for c in json.load(sys.stdin).get("caches", [])))'); do
            curl -sS -o /dev/null -w "Deleted old cache $CACHE_ID: HTTP %{http_code}\n" -X DELETE -H "x-auth-token: $CM_API_TOKEN" "https://api.codemagic.io/apps/$APP_ID/caches/$CACHE_ID"
          done
          # deletion is asynchronous: wait until the list is really empty (up to 5 min)
          for i in $(seq 1 30); do
            LEFT=$(curl -sS -H "x-auth-token: $CM_API_TOKEN" "https://api.codemagic.io/apps/$APP_ID/caches" | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("caches", [])))' || echo 1)
            [ "$LEFT" = "0" ] && echo "Old caches gone" && break
            sleep 10
          done
        fi
    - &config
      name: Generate build configuration
      script: |
        # The bundle_id/team_id must stay as in fake-codesigning: its profiles only match
        # C67CF9S4VU.ph.telegra.Telegraph. The IPA is re-signed when installed (sideloading).
        # For a real release swap these for our own bundle id + provisioning profiles.
        cat > build-system/ayugram-ci-configuration.json <<EOF
        {
          "bundle_id": "ph.telegra.Telegraph",
          "api_id": "$TG_API_ID",
          "api_hash": "$TG_API_HASH",
          "team_id": "C67CF9S4VU",
          "app_center_id": "0",
          "is_internal_build": "true",
          "is_appstore_build": "false",
          "appstore_id": "0",
          "app_specific_url_scheme": "tg",
          "premium_iap_product_id": "",
          "enable_siri": false,
          "enable_icloud": false
        }
        EOF

workflows:
  # Device build → IPA (download from Artifacts)
  ios-device:
    name: AyuGram iOS (device IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment: *env
    cache: *cache
    scripts:
      - *submodules
      - *metal
      - *restore_cache
      - *config
      - name: Build IPA
        script: |
          set -euo pipefail
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            --overrideXcodeVersion \
            build \
            --configurationPath=build-system/ayugram-ci-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath=build/artifacts
          mv build/artifacts/Telegram.ipa "build/artifacts/AyuGram-$BUILD_NUMBER.ipa"
      - *pack_cache
    artifacts:
      - build/artifacts/*.ipa
      - build/artifacts/Telegram.DSYMs.zip

  # Simulator build (arm64 simulator, no real signing) -> zipped .app (download from Artifacts).
  ios-simulator:
    name: AyuGram iOS (simulator .app)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment: *env
    cache: *cache
    scripts:
      - *submodules
      - *metal
      - *restore_cache
      - *config
      - name: Build for simulator
        script: |
          set -euo pipefail
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            --overrideXcodeVersion \
            build \
            --configurationPath=build-system/ayugram-ci-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=debug_sim_arm64 \
            --buildNumber="$BUILD_NUMBER"
          mkdir -p build/sim && cd build/sim
          unzip -q -o ../../bazel-bin/Telegram/Telegram.ipa
          cd Payload && zip -qry "../../AyuGram-sim-$BUILD_NUMBER.zip" Telegram.app
      - *pack_cache
    artifacts:
      - build/AyuGram-sim-*.zip

  # Demo machine: no build. Installs the latest simulator build into an iPhone simulator and keeps
  # the Mac running so it can be used over VNC (start the build with remote access enabled).
  # Stop it early with: touch ~/stop-demo   (on the Mac). Simulator recordings on the Desktop
  # (Simulator → File → Record Screen) are collected as artifacts.
  ios-demo:
    name: exteraGram demo (Simulator panel)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 27.1 # iOS 27 simulator runtime; the app itself is still built with 26.2
      groups:
        - codemagic_api
    scripts:
      - name: Download latest simulator build
        script: |
          set -euo pipefail
          APP_ID="${CM_PROJECT_ID:-6ac5d8d3276a02cb991e88a0}"
          URL=$(curl -sS -H "x-auth-token: $CM_API_TOKEN" "https://api.codemagic.io/builds?appId=$APP_ID&workflowId=ios-simulator&branch=master" | python3 -c '
          import json, sys
          for b in json.load(sys.stdin).get("builds", []):
              for a in b.get("artefacts") or []:
                  if b.get("status") in ("finished", "canceled") and a.get("name", "").endswith(".zip"):
                      print(a["url"]); sys.exit(0)
          sys.exit("no simulator build found")')
          curl -sS -L -H "x-auth-token: $CM_API_TOKEN" "$URL" -o demo.zip
          rm -rf demo && mkdir demo && unzip -q demo.zip -d demo
          ls demo
      - name: Boot simulator and install exteraGram
        script: |
          set -euo pipefail
          # Newest iOS runtime and the biggest "Pro Max" iPhone it supports (names change between Xcode versions)
          read RUNTIME DEVICE <<<"$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rs = [r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS")]
          r = sorted(rs, key=lambda r: [int(x) for x in r["version"].split(".")])[-1]
          types = [t for t in r.get("supportedDeviceTypes", []) if t.get("productFamily") == "iPhone"]
          print("iPhones:", ", ".join(t["name"] for t in types), file=sys.stderr)
          plain = [t for t in types if "Duo" not in t["name"] and "Fold" not in t["name"]]
          best = [t for t in plain if "Pro Max" in t["name"]] or [t for t in plain if "Pro" in t["name"]] or plain or types
          print(r["identifier"], best[-1]["identifier"])')"
          echo "Runtime: $RUNTIME, device: $DEVICE"
          UDID=$(xcrun simctl create "exteraGram demo" "$DEVICE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          # The window is optional: the panel streams the screen directly
          open -a "$(xcode-select -p)/Applications/Simulator.app" --args -CurrentDeviceUDID "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" demo/Telegram.app
          # Face ID enrolled, so protected chats ask for Face ID (Simulator → Features → Face ID → Matching Face)
          xcrun simctl spawn "$UDID" notifyutil -s com.apple.BiometricKit.enrollmentChanged 1 || true
          xcrun simctl spawn "$UDID" notifyutil -p com.apple.BiometricKit.enrollmentChanged || true
          xcrun simctl launch "$UDID" ph.telegra.Telegraph
          echo "$UDID" > ~/demo-udid
      - name: Start simulator panel
        script: |
          # Live stream + controls in a browser (build-system/demo/sim-panel.py), reached through an SSH tunnel to port 8080
          brew tap facebook/fb >/dev/null 2>&1 || true
          brew install facebook/fb/idb-companion >/dev/null 2>&1 || true
          pip3 install --quiet --break-system-packages fb-idb 2>/dev/null || pip3 install --quiet fb-idb
          nohup python3 build-system/demo/sim-panel.py "$(cat ~/demo-udid)" > ~/sim-panel.log 2>&1 &
          disown || true
          sleep 8
          curl -sS -o /dev/null -w "panel HTTP %{http_code}\n" http://127.0.0.1:8080/ || tail -20 ~/sim-panel.log
      - name: Keep the Mac running for the demo
        script: |
          END=$(( $(date +%s) + 40 * 60 ))
          while [ ! -f ~/stop-demo ] && [ "$(date +%s)" -lt "$END" ]; do
            echo "$(date +%H:%M) demo running, $(( (END - $(date +%s)) / 60 )) min left"
            sleep 60
          done
          mkdir -p demo-recordings
          cp ~/Desktop/*.mov ~/Desktop/*.mp4 demo-recordings/ 2>/dev/null || true
          ls -la demo-recordings
    artifacts:
      - demo-recordings/*
